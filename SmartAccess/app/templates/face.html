<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人脸识别管理 - SmartAccess</title>
    <style>
        :root { --primary:#667eea; --bg:#f7fafc; }
        * { box-sizing: border-box; }
        body { margin:0; background:var(--bg); font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color:#1a202c;}
        nav { background:#fff; border-bottom:1px solid #e2e8f0; padding:1rem 2rem; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:10;}
        nav .left { display:flex; gap:1rem; align-items:center;}
        nav .brand { font-weight:700; color:var(--primary); }
        nav .links { display:flex; gap:0.75rem; align-items:center;}
        nav a, nav button { text-decoration:none; color:#1a202c; background:#edf2f7; padding:0.55rem 0.9rem; border-radius:8px; border:none; cursor:pointer; }
        main { max-width:1180px; margin:1.5rem auto; padding:0 1.25rem; }
        .grid { display:grid; grid-template-columns:2fr 1fr; gap:1.25rem; }
        .card { background:#fff; border-radius:14px; padding:1.25rem 1.5rem; box-shadow:0 10px 30px rgba(0,0,0,0.06); }
        h2 { margin:0 0 1rem 0; }
        .video-box { position:relative; background:#000; border-radius:12px; overflow:hidden; }
        video, canvas { width:100%; border-radius:12px; background:#000; }
        .actions { display:flex; flex-wrap:wrap; gap:0.6rem; margin:0.9rem 0; }
        button.primary { background:var(--primary); color:#fff; border:none; padding:0.7rem 1rem; border-radius:10px; cursor:pointer; }
        button.ghost { background:#edf2f7; border:none; padding:0.7rem 1rem; border-radius:10px; cursor:pointer; }
        label { font-weight:600; color:#2d3748; display:block; margin:0.5rem 0 0.3rem; }
        select, input { width:100%; padding:0.65rem 0.75rem; border:1px solid #e2e8f0; border-radius:8px; }
        .muted { color:#4a5568; font-size:0.9rem; }
        .status { margin-top:0.75rem; padding:0.75rem; border-radius:10px; background:#edf2f7; color:#1a202c; }
        .status.good { background:#e6fffa; color:#047857; }
        .status.bad { background:#fef2f2; color:#b91c1c; }
        .result-list { display:grid; gap:0.6rem; margin-top:0.5rem; }
        .result-item { padding:0.65rem 0.75rem; border:1px solid #e2e8f0; border-radius:10px; background:#f8fafc; display:flex; justify-content:space-between; align-items:center; }
        .badge { padding:0.35rem 0.55rem; border-radius:8px; font-size:0.85rem; }
        .badge.ok { background:#e6fffa; color:#047857; }
        .badge.fail { background:#fef2f2; color:#b91c1c; }
        .tool-box { display:grid; gap:0.75rem; }
        .tool-box button { width:100%; }
        .block { margin-top:1rem; }
        .flex-row { display:flex; gap:0.5rem; align-items:center; }
        @media (max-width:1080px) { .grid { grid-template-columns:1fr; } }
    </style>
</head>
<body>
    <nav>
        <div class="left">
            <div class="brand">🔐 SmartAccess</div>
            <div class="links">
                <a href="/web/dashboard">控制台</a>
                <a href="/web/users">用户管理</a>
                <a href="/web/visitors">访客管理</a>
            </div>
        </div>
        <div class="links">
            <span id="welcome" style="color:#4a5568;"></span>
            <button onclick="logout()">退出登录</button>
        </div>
    </nav>

    <main>
        <div class="grid">
            <div class="card">
                <h2>实时摄像头</h2>
                <div class="video-box">
                    <video id="video" autoplay playsinline muted></video>
                    <canvas id="canvas" style="display:none;"></canvas>
                </div>
                <div class="actions">
                    <button class="ghost" onclick="startCamera()">启动摄像头</button>
                    <button class="primary" onclick="recognize()">识别人脸并开门</button>
                    <button class="ghost" onclick="registerFace()">录入人脸</button>
                    <button class="ghost" onclick="openDoor()">手动开门</button>
                    <button class="ghost" onclick="toggleStream()"><span id="stream-btn-text">暂停摄像头</span></button>
                </div>
                <div id="status" class="status">等待操作...</div>
                <div>
                    <h3>识别结果</h3>
                    <div id="results" class="result-list"></div>
                </div>

            <div class="section">
                <h3>已注册人脸</h3>
                <div class="actions">
                    <button class="ghost" onclick="loadFaces()">刷新列表</button>
                </div>
                <table style="width:100%; border-collapse:collapse; margin-top:0.5rem;">
                    <thead>
                        <tr><th>ID</th><th>用户</th><th>主脸</th><th>启用</th><th>创建时间</th><th>操作</th></tr>
                    </thead>
                    <tbody id="facesBody"></tbody>
                </table>
            </div>
            </div>

            <div class="card">
                <h2>参数与工具</h2>
                <label>选择用户（录入/开门使用）</label>
                <select id="userSelect"></select>
                <label>设备ID（开门指令用）</label>
                <input id="deviceId" placeholder="例如 door-lock-1">
                <label>识别阈值</label>
                <input id="threshold" type="number" step="0.01" min="0" max="1" value="0.7">
                <p class="muted">说明：识别成功后调用 `/api/hardware/bluetooth/unlock` 发送开门指令；仍可在后台实现真正的硬件控制逻辑。摄像头在 http 环境需浏览器明确授权，建议使用 https 或 localhost。</p>

                <div class="block">
                    <h3>face-access v2 工具</h3>
                    <div class="tool-box">
                        <button class="ghost" onclick="getDeviceInfo()">获取设备信息</button>
                        <button class="ghost" onclick="healthCheck()">健康检查</button>
                        <button class="ghost" onclick="clearCache()">清空识别缓存</button>
                    </div>
                    <div id="toolStatus" class="status" style="margin-top:0.75rem;">工具输出将在这里显示</div>
                </div>

                <div class="block">
                    <h3>批量录入</h3>
                    <input id="batchFiles" type="file" accept="image/*" multiple>
                    <button class="ghost" onclick="batchRegister()">批量上传</button>
                </div>

                <div class="block">
                    <h3>两张图片比对</h3>
                    <div class="flex-row">
                        <input id="compare1" type="file" accept="image/*">
                        <input id="compare2" type="file" accept="image/*">
                    </div>
                    <button class="ghost" onclick="compareFaces()">开始对比</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        const token = localStorage.getItem('smartaccess_token');
        const username = localStorage.getItem('smartaccess_username');
        if (!token) { window.location.href = '/web/auth'; }
        else { document.getElementById('welcome').textContent = username ? `你好，${username}` : '已登录'; }

        const userSelect = document.getElementById('userSelect');
        const statusBox = document.getElementById('status');
        const resultsBox = document.getElementById('results');
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const thresholdInput = document.getElementById('threshold');
        let stream;
        const userMap = {}; // username -> id
        let currentUserId = null;

        function logout() {
            localStorage.removeItem('smartaccess_token');
            localStorage.removeItem('smartaccess_username');
            window.location.href = '/web/auth';
        }
        function authHeaders(extra = {}) {
            return { 'Authorization': `Bearer ${token}`, ...extra };
        }
        function setStatus(msg, good=false, bad=false) {
            statusBox.textContent = msg;
            statusBox.className = 'status ' + (good ? 'good' : bad ? 'bad' : '');
        }
        function setToolStatus(msg, good=false, bad=false) {
            const box = document.getElementById('toolStatus');
            box.textContent = msg;
            box.className = 'status ' + (good ? 'good' : bad ? 'bad' : '');
        }

        async function loadUsers() {
            try {
                const res = await fetch('/api/users/', { headers: authHeaders() });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || '加载用户失败');
                userSelect.innerHTML = '';
                data.forEach(u => {
                    userMap[u.username] = u.id;
                    const opt = document.createElement('option');
                    opt.value = u.id;
                    opt.textContent = `${u.username}` + (u.full_name ? ` (${u.full_name})` : '');
                    userSelect.appendChild(opt);
                });
                if (data.length) {
                    userSelect.value = data[0].id;
                    currentUserId = data[0].id;
                    loadFaces();
                }
            } catch (e) {
                setStatus(e.message, false, true);
            }
        }

        userSelect?.addEventListener('change', () => {
            currentUserId = userSelect.value;
            loadFaces();
        });

        async function startCamera() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                setStatus('当前浏览器不支持摄像头访问', false, true);
                return;
            }
            try {
                // 尝试前置摄像头，如失败再退回默认
                const constraints = { video: { facingMode: 'user' }, audio: false };
                stream = await navigator.mediaDevices.getUserMedia(constraints);
            } catch (e) {
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                } catch (err) {
                    const insecure = location.protocol !== 'https:' && location.hostname !== 'localhost';
                    const hint = insecure ? '（请使用 https 或 localhost 访问以启用摄像头）' : '';
                    setStatus('无法访问摄像头: ' + err.name + ' ' + err.message + ' ' + hint, false, true);
                    return;
                }
            }
            if (!stream) {
                setStatus('摄像头流未获取到', false, true);
                return;
            }
            const track = stream.getVideoTracks()[0];
            track.onended = () => setStatus('摄像头已被系统或用户关闭', false, true);
            video.srcObject = stream;
            video.onloadedmetadata = () => {
                video.play().catch((err)=>setStatus('播放视频失败: ' + err.message, false, true));
                setStatus('摄像头已启动');
            };
        }
        function toggleStream() {
            if (!stream) return;
            const enabled = stream.getVideoTracks()[0].enabled;
            stream.getVideoTracks()[0].enabled = !enabled;
            document.getElementById('stream-btn-text').textContent = enabled ? '恢复摄像头' : '暂停摄像头';
            setStatus(enabled ? '摄像头已暂停' : '摄像头已恢复');
        }

        function captureFrame() {
            if (!stream || !video.videoWidth || !video.videoHeight) {
                setStatus('摄像头未就绪，请先点击启动摄像头并允许权限', false, true);
                throw new Error('camera_not_ready');
            }
            const w = video.videoWidth || 640;
            const h = video.videoHeight || 480;
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, w, h);
            return new Promise(resolve => {
                canvas.toBlob(blob => resolve(blob), 'image/jpeg', 0.9);
            });
        }

        async function registerFace() {
            const userId = userSelect.value;
            if (!userId) return setStatus('请先选择用户', false, true);
            setStatus('采集图像并上传中...');
            const blob = await captureFrame();
            const fd = new FormData();
            fd.append('file', blob, 'capture.jpg');
            try {
                const res = await fetch(`/api/face-recognition/register/${userId}`, {
                    method: 'POST',
                    headers: authHeaders(),
                    body: fd
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || data.message || '录入失败');
                setStatus('人脸录入成功', true);
            } catch (e) {
                setStatus(e.message, false, true);
            }
        }

        async function getDeviceInfo() {
            try {
                const res = await fetch('/api/face-recognition/info', { headers: authHeaders() });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || '获取失败');
                setToolStatus(`设备: ${data.device} 阈值:${data.threshold} 缓存:${data.cache_size}`, true);
            } catch (e) {
                setToolStatus(e.message, false, true);
            }
        }

        async function healthCheck() {
            try {
                const res = await fetch('/api/face-recognition/health', { headers: authHeaders() });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || '检查失败');
                setToolStatus(data.message || '健康', true);
            } catch (e) {
                setToolStatus(e.message, false, true);
            }
        }

        async function clearCache() {
            try {
                const res = await fetch('/api/face-recognition/cache/clear', { method:'POST', headers: authHeaders() });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || '清理失败');
                setToolStatus(data.message || '缓存已清空', true);
            } catch (e) {
                setToolStatus(e.message, false, true);
            }
        }

        async function batchRegister() {
            const userId = userSelect.value;
            const files = document.getElementById('batchFiles').files;
            if (!userId) return setToolStatus('请先选择用户', false, true);
            if (!files || !files.length) return setToolStatus('请选择至少一张图片', false, true);
            const fd = new FormData();
            Array.from(files).forEach(f => fd.append('files', f));
            const url = `/api/face-recognition/batch-register?user_id=${encodeURIComponent(userId)}`;
            try {
                const res = await fetch(url, { method:'POST', headers: authHeaders(), body: fd });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || data.message || '批量上传失败');
                setToolStatus(data.message || '批量上传完成', true);
            } catch (e) {
                setToolStatus(e.message, false, true);
            }
        }

        async function compareFaces() {
            const f1 = document.getElementById('compare1').files[0];
            const f2 = document.getElementById('compare2').files[0];
            if (!f1 || !f2) return setToolStatus('请选择两张图片再对比', false, true);
            const fd = new FormData();
            fd.append('file1', f1);
            fd.append('file2', f2);
            try {
                const res = await fetch('/api/face-recognition/compare', { method:'POST', headers: authHeaders(), body: fd });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || '对比失败');
                setToolStatus(`相似度: ${data.similarity?.toFixed(3)} 阈值: ${data.threshold}`, true);
            } catch (e) {
                setToolStatus(e.message, false, true);
            }
        }

        async function recognize() {
            setStatus('识别中...');
            const blob = await captureFrame();
            const fd = new FormData();
            fd.append('file', blob, 'capture.jpg');
            try {
                const res = await fetch('/api/face-recognition/recognize', {
                    method: 'POST',
                    headers: authHeaders(),
                    body: fd
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || '识别失败');
                renderResults(data);
                const th = parseFloat(thresholdInput.value || '0.7');
                const matched = data.find(r => r.status === 'recognized' && r.similarity >= th);
                if (matched) {
                    setStatus(`识别成功：${matched.name} 相似度 ${matched.similarity.toFixed(2)}`, true);
                    const uid = userMap[matched.name];
                    if (uid) await openDoor(uid, matched.name);
                    else setStatus('识别成功但未找到匹配用户ID', false, true);
                } else {
                    setStatus('未识别到已注册人脸', false, true);
                }
            } catch (e) {
                setStatus(e.message, false, true);
            }
        }

        function renderResults(list) {
            resultsBox.innerHTML = '';
            if (!list || !list.length) {
                resultsBox.innerHTML = '<div class="muted">暂无结果</div>';
                return;
            }
            list.forEach(item => {
                const div = document.createElement('div');
                div.className = 'result-item';
                div.innerHTML = `
                    <div>
                        <div><strong>${item.name || '未知'}</strong></div>
                        <div class="muted">相似度: ${(item.similarity*100).toFixed(1)}% | 状态: ${item.status}</div>
                    </div>
                    <span class="badge ${item.status==='recognized' ? 'ok' : 'fail'}">${item.status}</span>
                `;
                resultsBox.appendChild(div);
            });
        }

        async function openDoor(forceUserId=null, matchedName=null) {
            const userId = forceUserId || userSelect.value;
            const deviceId = document.getElementById('deviceId').value.trim();
            if (!userId) return setStatus('请先选择用户', false, true);
            if (!deviceId) return setStatus('请填写设备ID用于开门指令', false, true);
            try {
                const url = `/api/hardware/bluetooth/unlock?user_id=${encodeURIComponent(userId)}&device_id=${encodeURIComponent(deviceId)}`;
                const res = await fetch(url, { method:'POST', headers: authHeaders() });
                const data = await res.json();
                if (res.ok && data.status === 'success') {
                    setStatus(`已发送开门指令${matchedName ? '：' + matchedName : ''}`, true);
                } else {
                    throw new Error(data.message || '开门失败');
                }
            } catch (e) {
                setStatus(e.message, false, true);
            }
        }

        async function loadFaces() {
            if (!currentUserId) return;
            try {
                const res = await fetch(`/api/users/${currentUserId}/faces`, { headers: authHeaders() });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || '加载人脸失败');
                const body = document.getElementById('facesBody');
                body.innerHTML = '';
                if (!data.length) {
                    body.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#718096;">暂无人脸</td></tr>';
                }
                data.forEach(f => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${f.id}</td>
                        <td>${currentUserId}</td>
                        <td>${f.is_primary ? '是' : '否'}</td>
                        <td>${f.is_active ? '启用' : '禁用'}</td>
                        <td>${f.created_at ? new Date(f.created_at).toLocaleString('zh-CN') : '-'}</td>
                        <td class="actions">
                            <button class="ghost" onclick="setPrimary(${f.id})">设为主脸</button>
                            <button class="ghost" onclick="toggleFace(${f.id}, ${!f.is_active})">${f.is_active ? '禁用' : '启用'}</button>
                            <button class="ghost" onclick="deleteFace(${f.id})">删除</button>
                        </td>
                    `;
                    body.appendChild(tr);
                });
            } catch (e) {
                setStatus(e.message, false, true);
            }
        }

        async function setPrimary(faceId) {
            try {
                const res = await fetch(`/api/users/face/${faceId}`, {
                    method:'PUT',
                    headers:{ 'Content-Type':'application/json', ...authHeaders() },
                    body: JSON.stringify({ is_primary: true })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || '设置失败');
                setStatus('已设为主脸', true);
                loadFaces();
            } catch (e) { setStatus(e.message, false, true); }
        }

        async function toggleFace(faceId, enable) {
            try {
                const res = await fetch(`/api/users/face/${faceId}`, {
                    method:'PUT',
                    headers:{ 'Content-Type':'application/json', ...authHeaders() },
                    body: JSON.stringify({ is_active: enable })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || '更新失败');
                setStatus('已更新状态', true);
                loadFaces();
            } catch (e) { setStatus(e.message, false, true); }
        }

        async function deleteFace(faceId) {
            if (!confirm('确定删除此人脸？')) return;
            try {
                const res = await fetch(`/api/users/${currentUserId}/faces/${faceId}`, { method:'DELETE', headers: authHeaders() });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || '删除失败');
                setStatus('删除成功', true);
                loadFaces();
            } catch (e) { setStatus(e.message, false, true); }
        }

        // init
        loadUsers();
        // 自动尝试启动摄像头，若被浏览器策略阻止，用户可手动点击“启动摄像头”
        startCamera().catch(()=>{});
    </script>
</body>
</html>
