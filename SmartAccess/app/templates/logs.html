<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>访问日志 - SmartAccess</title>
    <style>
        :root { --primary:#667eea; --bg:#f7fafc; }
        * { box-sizing:border-box; }
        body { margin:0; background:var(--bg); font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color:#1a202c; }
        nav { background:#fff; border-bottom:1px solid #e2e8f0; padding:1rem 2rem; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:10;}
        nav .left { display:flex; gap:1rem; align-items:center;}
        nav .brand { font-weight:700; color:var(--primary); }
        nav .links { display:flex; gap:0.75rem; align-items:center;}
        nav a, nav button { text-decoration:none; color:#1a202c; background:#edf2f7; padding:0.55rem 0.9rem; border-radius:8px; border:none; cursor:pointer; }
        main { max-width:1180px; margin:1.5rem auto; padding:0 1.25rem; display:grid; gap:1rem; grid-template-columns:1fr; }
        .card { background:#fff; border-radius:14px; padding:1.25rem 1.5rem; box-shadow:0 10px 30px rgba(0,0,0,0.06); }
        h2 { margin:0 0 1rem 0; }
        label { font-weight:600; color:#2d3748; margin-right:0.5rem; }
        select, input { padding:0.55rem 0.65rem; border:1px solid #e2e8f0; border-radius:8px; }
        button.primary { background:var(--primary); color:#fff; border:none; padding:0.65rem 1rem; border-radius:10px; cursor:pointer; }
        table { width:100%; border-collapse:collapse; margin-top:0.75rem; }
        th, td { padding:0.65rem; border-bottom:1px solid #e2e8f0; text-align:left; }
        th { background:#f8fafc; }
        .status { margin-top:0.75rem; padding:0.75rem; border-radius:10px; background:#edf2f7; color:#1a202c; }
        .status.good { background:#e6fffa; color:#047857; }
        .status.bad { background:#fef2f2; color:#b91c1c; }
    </style>
</head>
<body>
    <nav>
        <div class="left">
            <div class="brand">🔐 SmartAccess</div>
            <div class="links">
                <a href="/web/dashboard">控制台</a>
                <a href="/web/users">用户管理</a>
                <a href="/web/visitors">访客管理</a>
                <a href="/web/face">人脸识别</a>
                <a href="/web/hardware">硬件</a>
            </div>
        </div>
        <div class="links">
            <span id="welcome" style="color:#4a5568;"></span>
            <button onclick="logout()">退出登录</button>
        </div>
    </nav>

    <main>
        <div class="card">
            <h2>访问日志</h2>
            <div style="display:flex; gap:0.75rem; flex-wrap:wrap; align-items:center;">
                <div>
                    <label>类型</label>
                    <select id="typeFilter">
                        <option value="">全部</option>
                        <option value="face">face</option>
                        <option value="nfc">nfc</option>
                        <option value="bluetooth">bluetooth</option>
                        <option value="qrcode">qrcode</option>
                        <option value="manual">manual</option>
                    </select>
                </div>
                <div>
                    <label>状态</label>
                    <select id="statusFilter">
                        <option value="">全部</option>
                        <option value="success">success</option>
                        <option value="failed">failed</option>
                        <option value="denied">denied</option>
                    </select>
                </div>
                <div>
                    <label>天数</label>
                    <input id="daysInput" type="number" min="1" max="30" value="7" style="width:90px;">
                </div>
                <button class="primary" onclick="loadLogs()">刷新</button>
                <button class="ghost" onclick="exportCsv()">导出 CSV</button>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>时间</th>
                        <th>用户ID</th>
                        <th>类型</th>
                        <th>状态</th>
                        <th>设备ID</th>
                        <th>详情</th>
                    </tr>
                </thead>
                <tbody id="logBody"></tbody>
            </table>
            <div id="status" class="status">等待加载...</div>
        </div>
    </main>

    <script>
        const token = localStorage.getItem('smartaccess_token');
        const username = localStorage.getItem('smartaccess_username');
        if (!token) { window.location.href = '/web/auth'; }
        else { document.getElementById('welcome').textContent = username ? `你好，${username}` : '已登录'; }

        function logout() {
            localStorage.removeItem('smartaccess_token');
            localStorage.removeItem('smartaccess_username');
            window.location.href = '/web/auth';
        }
        function authHeaders(extra = {}) { return { 'Authorization': `Bearer ${token}`, ...extra }; }
        function setStatus(msg, good=false, bad=false) {
            const box = document.getElementById('status');
            box.textContent = msg;
            box.className = 'status ' + (good ? 'good' : bad ? 'bad' : '');
        }

        async function loadLogs() {
            const type = document.getElementById('typeFilter').value;
            const statusF = document.getElementById('statusFilter').value;
            const days = document.getElementById('daysInput').value || 7;
            const params = new URLSearchParams();
            params.set('days', days);
            if (type) params.set('access_type', type);
            if (statusF) params.set('status', statusF);
            const url = '/api/hardware/logs?' + params.toString();
            try {
                const res = await fetch(url, { headers: authHeaders() });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || '加载日志失败');
                const body = document.getElementById('logBody');
                body.innerHTML = '';
                if (!data.length) {
                    body.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#718096;">暂无日志</td></tr>';
                }
                data.forEach(l => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${l.timestamp ? new Date(l.timestamp).toLocaleString('zh-CN') : '-'}</td>
                        <td>${l.user_id ?? '-'}</td>
                        <td>${l.access_type || '-'}</td>
                        <td>${l.status || '-'}</td>
                        <td>${l.device_id || '-'}</td>
                        <td>${l.details || '-'}</td>
                    `;
                    body.appendChild(tr);
                });
                setStatus('日志加载完成', true);
            } catch (e) {
                setStatus(e.message, false, true);
            }
        }

        async function exportCsv() {
            const type = document.getElementById('typeFilter').value;
            const statusF = document.getElementById('statusFilter').value;
            const days = document.getElementById('daysInput').value || 7;
            const params = new URLSearchParams();
            params.set('days', days);
            if (type) params.set('access_type', type);
            if (statusF) params.set('status', statusF);
            const url = '/api/hardware/logs?' + params.toString();
            try {
                const res = await fetch(url, { headers: authHeaders() });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || '导出失败');
                const rows = [['时间','用户ID','类型','状态','设备ID','详情']];
                data.forEach(l => {
                    rows.push([
                        l.timestamp ? new Date(l.timestamp).toLocaleString('zh-CN') : '',
                        l.user_id ?? '',
                        l.access_type || '',
                        l.status || '',
                        l.device_id || '',
                        (l.details || '').replace(/"/g,'""')
                    ]);
                });
                const csv = rows.map(r => r.map(x => `"${x}"`).join(',')).join('\n');
                const blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = 'access_logs.csv';
                link.click();
            } catch (e) {
                setStatus(e.message, false, true);
            }
        }

        loadLogs();
    </script>
</body>
</html>
