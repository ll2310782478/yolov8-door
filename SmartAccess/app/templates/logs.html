<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>访问日志 - SmartAccess</title>
        <style>

        /* 左侧导航栏 */
        .sidebar-header .icon { font-size: 1.8rem; }
        .sidebar-header .title {
            font-size: 1.1rem;
            font-weight: 700;
            white-space: nowrap;
            opacity: 1;
            transition: opacity 0.3s;
        }
        .sidebar.collapsed .sidebar-header .title { opacity: 0; width: 0; overflow: hidden; }
        .sidebar-toggle:hover { background: rgba(255,255,255,0.25); }
        .nav-link:hover, .nav-link.active {
            background: rgba(255,255,255,0.15);
            color: #fff;
        }
        .nav-link .icon { font-size: 1.3rem; min-width: 1.3rem; }
        .nav-link .label {
            white-space: nowrap;
            opacity: 1;
            transition: opacity 0.3s;
        }
        .sidebar.collapsed .nav-link .label { opacity: 0; width: 0; overflow: hidden; }
        /* 主内容区 */
        .topbar {
            background: #fff;
            border-bottom: 1px solid var(--border);
            padding: 0.75rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .user-actions { display: flex; gap: 0.75rem; align-items: center; }
        .user-actions span { color: var(--text-muted); }
        </style>
  <link rel="stylesheet" href="/static/css/common.css">
  </head>
<body>
  <script src="/static/js/common.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', async () => {
      const token = (window.getStoredToken ? window.getStoredToken() : localStorage.getItem('token'));
      if (!token) {
        window.location.href = '/web/auth';
        return;
      }
      
      try {
        const res = await fetch('/api/auth/me', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!res.ok) throw new Error('未授权');
      } catch (err) {
        localStorage.removeItem('token');
        window.location.href = '/web/auth';
      }
    });
  </script>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="icon">🔐</span>
      <span class="title">SmartAccess</span>
      <button class="sidebar-toggle" onclick="toggleSidebar()">☰</button>
    </div>
    <nav>
      <ul class="nav-menu">
        <li class="nav-item">
          <a href="/web/dashboard" class="nav-link" data-tooltip="仪表盘">
            <span class="icon">📊</span>
            <span class="label">仪表盘</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="/web/users" class="nav-link" data-tooltip="用户管理">
            <span class="icon">👥</span>
            <span class="label">用户管理</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="/web/visitors" class="nav-link" data-tooltip="访客管理">
            <span class="icon">👤</span>
            <span class="label">访客管理</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="/web/face" class="nav-link" data-tooltip="人脸识别">
            <span class="icon">😀</span>
            <span class="label">人脸识别</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="/web/hardware" class="nav-link" data-tooltip="硬件设备">
            <span class="icon">🛠️</span>
            <span class="label">硬件设备</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="/web/nfc" class="nav-link" data-tooltip="NFC管理">
            <span class="icon">📶</span>
            <span class="label">NFC管理</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="/web/bluetooth" class="nav-link" data-tooltip="蓝牙设备">
            <span class="icon">🔵</span>
            <span class="label">蓝牙设备</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="/web/remote-door" class="nav-link" data-tooltip="远程开门">
            <span class="icon">🚪</span>
            <span class="label">远程开门</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="/web/logs" class="nav-link active" data-tooltip="访问日志">
            <span class="icon">📜</span>
            <span class="label">访问日志</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="/web/settings" class="nav-link" data-tooltip="系统设置">
            <span class="icon">⚙️</span>
            <span class="label">系统设置</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="/docs" class="nav-link" data-tooltip="API文档" target="_blank">
            <span class="icon">📖</span>
            <span class="label">API文档</span>
          </a>
        </li>
      </ul>
    </nav>
  </aside>

  <div class="main-content">
    <div class="topbar">
      <h1>访问日志</h1>
      <div class="user-actions">
        <span id="welcome"></span>
        <button class="btn btn-ghost" onclick="loadLogs()">🔄 刷新</button>
        <button class="btn btn-primary" onclick="logout()">退出登录</button>
      </div>
    </div>

    <div class="content">
      <div class="card">
            <h2>访问日志</h2>
            <div style="display:flex; gap:0.75rem; flex-wrap:wrap; align-items:center;">
                <div>
                    <label>类型</label>
                    <select id="typeFilter">
                        <option value="">全部</option>
                        <option value="face">face</option>
                        <option value="nfc">nfc</option>
                        <option value="bluetooth">bluetooth</option>
                        <option value="qrcode">qrcode</option>
                        <option value="manual">manual</option>
                    </select>
                </div>
                <div>
                    <label>状态</label>
                    <select id="statusFilter">
                        <option value="">全部</option>
                        <option value="success">success</option>
                        <option value="failed">failed</option>
                        <option value="denied">denied</option>
                    </select>
                </div>
                <div>
                    <label>开始日期</label>
                    <input id="startDateInput" type="date" style="width:140px;">
                </div>
                <div>
                    <label>结束日期</label>
                    <input id="endDateInput" type="date" style="width:140px;">
                </div>
                <button class="primary" onclick="loadLogs()">刷新</button>
                <button class="ghost" onclick="exportCsv()">导出 CSV</button>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>时间</th>
                        <th>用户ID</th>
                        <th>类型</th>
                        <th>状态</th>
                        <th>设备ID</th>
                        <th>详情</th>
                    </tr>
                </thead>
                <tbody id="logBody"></tbody>
            </table>
            <div id="status" class="status">等待加载...</div>
        </div>
    </div>
  </div>

    <script>

    const token = (window.getStoredToken ? window.getStoredToken() : localStorage.getItem('token'));
        const username = localStorage.getItem('username');
        if (!token) { 
            window.location.href = '/web/auth'; 
        } else {
            document.getElementById('welcome').textContent = username ? `你好，${username}` : '已登录';
            initDatePickers();  // 初始化日期选择器
        }

        function setStatus(msg, good=false, bad=false) {
            const box = document.getElementById('status');
            box.textContent = msg;
            box.className = 'status ' + (good ? 'good' : bad ? 'bad' : '');
        }
        /**
         * 初始化日期选择器的默认值（最近 7 天）
         */
        function initDatePickers() {
            const today = new Date();
            const sevenDaysAgo = new Date(today);
            sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);
            
            const startDateInput = document.getElementById('startDateInput');
            const endDateInput = document.getElementById('endDateInput');
            
            // 设置默认值：最近 7天
            endDateInput.value = today.toISOString().split('T')[0];
            startDateInput.value = sevenDaysAgo.toISOString().split('T')[0];
        }
        
        async function loadLogs() {
            const type = document.getElementById('typeFilter').value;
            const statusF = document.getElementById('statusFilter').value;
            const startDate = document.getElementById('startDateInput').value;
            const endDate = document.getElementById('endDateInput').value;
            const params = new URLSearchParams();
            if (startDate) params.set('start_date', startDate);
            if (endDate) params.set('end_date', endDate);
            if (type) params.set('access_type', type);
            if (statusF) params.set('status', statusF);
            const url = '/api/hardware/logs?' + params.toString();
            
            // 显示加载状态
            setStatus('正在加载日志...', 'info');
            
            try {
                const res = await fetch(url, { headers: authHeaders() });
                if (res.status === 401) {
                  localStorage.removeItem('token');
                  localStorage.removeItem('access_token');
                  sessionStorage.removeItem('token');
                  sessionStorage.removeItem('access_token');
                  window.location.href = '/web/auth';
                  return;
                }
                
                // 检查响应状态
                if (!res.ok) {
                    // 尝试解析 JSON 错误响应
                    const errorData = await res.json().catch(() => ({
                        error: { message: `HTTP ${res.status}: 服务器错误` }
                    }));
                    
                    throw new Error(
                        errorData.error?.message || 
                        errorData.detail || 
                        `HTTP ${res.status}: 请求失败`
                    );
                }
                
                const data = await res.json();

                const body = document.getElementById('logBody');
                body.innerHTML = '';
                if (!data.length) {
                    body.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#718096;">暂无日志</td></tr>';
                }
                data.forEach(l => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${l.timestamp ? new Date(l.timestamp).toLocaleString('zh-CN') : '-'}</td>
                        <td>${l.user_id ?? '-'}</td>
                        <td>${l.access_type || '-'}</td>
                        <td>${l.status || '-'}</td>
                        <td>${l.device_id || '-'}</td>
                        <td>${l.details || '-'}</td>
                    `;
                    body.appendChild(tr);
                });
                setStatus('日志加载完成', true);
            } catch (e) {
                console.error('加载日志时发生错误:', e);
                setStatus(`加载失败: ${e.message}`, false, true);
            }
        }
        async function exportCsv() {
            const type = document.getElementById('typeFilter').value;
            const statusF = document.getElementById('statusFilter').value;
            const startDate = document.getElementById('startDateInput').value;
            const endDate = document.getElementById('endDateInput').value;
            const params = new URLSearchParams();
            if (startDate) params.set('start_date', startDate);
            if (endDate) params.set('end_date', endDate);
            if (type) params.set('access_type', type);
            if (statusF) params.set('status', statusF);
            const url = '/api/hardware/logs?' + params.toString();
            
            try {
                const res = await fetch(url, { headers: authHeaders() });
                if (res.status === 401) {
                  localStorage.removeItem('token');
                  localStorage.removeItem('access_token');
                  sessionStorage.removeItem('token');
                  sessionStorage.removeItem('access_token');
                  window.location.href = '/web/auth';
                  return;
                }
                
                // 检查响应状态
                if (!res.ok) {
                    const errorData = await res.json().catch(() => ({
                        error: { message: `HTTP ${res.status}: 导出失败` }
                    }));
                    
                    throw new Error(
                        errorData.error?.message || 
                        errorData.detail || 
                        `HTTP ${res.status}: 导出失败`
                    );
                }
                
                const data = await res.json();

                const rows = [['时间','用户ID','类型','状态','设备ID','详情']];
                data.forEach(l => {
                    rows.push([
                        l.timestamp ? new Date(l.timestamp).toLocaleString('zh-CN') : '',
                        l.user_id ?? '',
                        l.access_type || '',
                        l.status || '',
                        l.device_id || '',
                        (l.details || '').replace(/"/g,'""')
                    ]);
                });
                const csv = rows.map(r => r.map(x => `"${x}"`).join(',')).join('\n');
                const blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = 'access_logs.csv';
                link.click();
            } catch (e) {
                console.error('导出CSV时发生错误:', e);
                setStatus(`导出失败: ${e.message}`, false, true);
            }
        }
        loadLogs();
    </script>
  </body>
</html>
