<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>硬件设备中心 - SmartAccess</title>
        <style>

        /* 左侧导航栏 */
        .sidebar-header .icon { font-size: 1.8rem; }
        .sidebar-header .title {
            font-size: 1.1rem;
            font-weight: 700;
            white-space: nowrap;
            opacity: 1;
            transition: opacity 0.3s;
        }
        .sidebar.collapsed .sidebar-header .title { opacity: 0; width: 0; overflow: hidden; }
        .sidebar-toggle:hover { background: rgba(255,255,255,0.25); }
        .nav-link:hover, .nav-link.active {
            background: rgba(255,255,255,0.15);
            color: #fff;
        }
        .nav-link .icon { font-size: 1.3rem; min-width: 1.3rem; }
        .nav-link .label {
            white-space: nowrap;
            opacity: 1;
            transition: opacity 0.3s;
        }
        .sidebar.collapsed .nav-link .label { opacity: 0; width: 0; overflow: hidden; }
        /* 主内容区 */
        .topbar {
            background: #fff;
            border-bottom: 1px solid var(--border);
            padding: 0.75rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .user-actions { display: flex; gap: 0.75rem; align-items: center; }
        .user-actions span { color: var(--text-muted); }
        /* 响应式 */
        main { max-width:1200px; margin:1.5rem auto; padding:0 1.25rem; display:grid; gap:1rem; grid-template-columns:2fr 1.05fr; align-items:start; }
        .card { background:var(--card); border-radius:14px; padding:1.25rem 1.5rem; box-shadow:0 10px 30px rgba(0,0,0,0.06); }
        h2 { margin:0 0 0.75rem 0; }
        .grid-3 { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:0.75rem; margin-bottom:1rem; }
        .stat { border:1px solid var(--border); border-radius:12px; padding:0.85rem; background:#f8fafc; }
        .stat h3 { margin:0; font-size:1.1rem; color:var(--text-muted); }
        .stat .value { font-size:1.6rem; font-weight:700; margin-top:0.25rem; }
        table { width:100%; border-collapse:collapse; margin-top:0.35rem; }
        th, td { padding:0.6rem 0.5rem; border-bottom:1px solid var(--border); text-align:left; }
        th { background:#f8fafc; }
        .pill { padding:0.15rem 0.5rem; border-radius:999px; font-size:0.85rem; }
        .pill.online { background:#dcfce7; color:#166534; }
        .pill.offline { background:#fee2e2; color:#b91c1c; }
        .row { display:flex; gap:0.65rem; flex-wrap:wrap; }
        .half { flex:1 1 48%; min-width:240px; }
        label { font-weight:600; color:#2d3748; display:block; margin:0.4rem 0 0.2rem; }
        input, select { width:100%; padding:0.65rem 0.75rem; border:1px solid var(--border); border-radius:8px; }
        button.primary { background:var(--primary); color:#fff; border:none; padding:0.7rem 1rem; border-radius:10px; cursor:pointer; }
        button.ghost { background:#edf2f7; border:none; padding:0.7rem 1rem; border-radius:10px; cursor:pointer; }
        .status { margin-top:0.65rem; padding:0.7rem; border-radius:10px; background:#edf2f7; color:var(--text); }
        .status.good { background:#e6fffa; color:#047857; }
        .status.bad { background:#fef2f2; color:#b91c1c; }
        .actions { display:flex; gap:0.35rem; flex-wrap:wrap; }
        .logs { max-height:360px; overflow:auto; border:1px solid var(--border); border-radius:10px; padding:0.4rem; background:#f8fafc; }
        .log-item { border-bottom:1px solid var(--border); padding:0.4rem 0; font-size:0.95rem; }
        .log-item:last-child { border-bottom:none; }
        .muted { color:var(--text-muted); font-size:0.9rem; }
        .card { background:#ffffff; }
        </style>
  <link rel="stylesheet" href="/static/css/common.css">
  </head>
<body>
  <script src="/static/js/common.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', async () => {
      const token = localStorage.getItem('token');
      if (!token) {
        window.location.href = '/web/auth';
        return;
      }
      
      try {
        const res = await fetch('/api/auth/me', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!res.ok) throw new Error('未授权');
      } catch (err) {
        localStorage.removeItem('token');
        window.location.href = '/web/auth';
      }
    });
  </script>
  <!-- 左侧导航栏 -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="icon">🔐</span>
      <span class="title">SmartAccess</span>
      <button class="sidebar-toggle" onclick="toggleSidebar()">☰</button>
    </div>
    <nav>
      <ul class="nav-menu">
        <li class="nav-item">
          <a href="/web/dashboard" class="nav-link" data-tooltip="仪表盘">
            <span class="icon">📊</span>
            <span class="label">仪表盘</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="/web/users" class="nav-link" data-tooltip="用户管理">
            <span class="icon">👥</span>
            <span class="label">用户管理</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="/web/visitors" class="nav-link" data-tooltip="访客管理">
            <span class="icon">👤</span>
            <span class="label">访客管理</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="/web/face" class="nav-link" data-tooltip="人脸识别">
            <span class="icon">😀</span>
            <span class="label">人脸识别</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="/web/hardware" class="nav-link active" data-tooltip="硬件设备">
            <span class="icon">🛠️</span>
            <span class="label">硬件设备</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="/web/nfc" class="nav-link" data-tooltip="NFC管理">
            <span class="icon">📶</span>
            <span class="label">NFC管理</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="/web/bluetooth" class="nav-link" data-tooltip="蓝牙设备">
            <span class="icon">🔵</span>
            <span class="label">蓝牙设备</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="/web/remote-door" class="nav-link" data-tooltip="远程开门">
            <span class="icon">🚪</span>
            <span class="label">远程开门</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="/web/logs" class="nav-link" data-tooltip="访问日志">
            <span class="icon">📜</span>
            <span class="label">访问日志</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="/web/settings" class="nav-link" data-tooltip="系统设置">
            <span class="icon">⚙️</span>
            <span class="label">系统设置</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="/docs" class="nav-link" data-tooltip="API文档" target="_blank">
            <span class="icon">📖</span>
            <span class="label">API文档</span>
          </a>
        </li>
      </ul>
    </nav>
  </aside>

  <!-- 主内容区 -->
  <div class="main-content">
    <div class="topbar">
      <h1>硬件设备中心</h1>
      <div class="user-actions">
        <span id="welcome"></span>
        <button class="btn btn-ghost" onclick="loadDevices()">🔄 刷新</button>
        <button class="btn btn-primary" onclick="logout()">退出登录</button>
      </div>
    </div>

    <div class="content">
      <main>
        <div class="card" style="grid-column:1/span 1;">
            <h2>硬件设备实时概览</h2>
            <div class="grid-3" id="stats">
                <div class="stat"><h3>在线设备</h3><div class="value" id="stat_online">-</div></div>
                <div class="stat"><h3>离线设备</h3><div class="value" id="stat_offline">-</div></div>
                <div class="stat"><h3>最近心跳</h3><div class="value" id="stat_recent">-</div></div>
            </div>

            <table>
                <thead>
                    <tr>
                        <th style="width:16%">设备ID</th>
                        <th style="width:16%">名称</th>
                        <th style="width:12%">类型</th>
                        <th style="width:16%">位置 / IP</th>
                        <th style="width:12%">状态</th>
                        <th style="width:18%">最后心跳</th>
                        <th style="width:10%">操作</th>
                    </tr>
                </thead>
                <tbody id="deviceBody"></tbody>
            </table>
            <div id="status" class="status">等待加载...</div>
        </div>

        <div class="card" style="grid-column:2/span 1;">
            <h2>注册 / 编辑设备</h2>
            <label>设备ID *</label>
            <input id="d_id" placeholder="door-lock-1">
            <label>设备名称 *</label>
            <input id="d_name" placeholder="西侧门锁">
            <label>类型</label>
            <select id="d_type">
                <option value="door_controller">door_controller</option>
                <option value="door_lock">door_lock</option>
                <option value="nfc_reader">nfc_reader</option>
                <option value="bluetooth_scanner">bluetooth_scanner</option>
                <option value="camera">camera</option>
            </select>
            <label>位置</label>
            <input id="d_loc" placeholder="1F 大厅">
            <div class="row">
                <div class="half">
                    <label>IP</label>
                    <input id="d_ip" placeholder="192.168.1.100">
                </div>
                <div class="half">
                    <label>端口</label>
                    <input id="d_port" placeholder="8000" type="number">
                </div>
            </div>
            <div class="row" style="margin-top:0.8rem; gap:0.6rem;">
                <button class="primary" onclick="saveDevice()" style="flex:1;">保存/注册</button>
                <button class="ghost" onclick="clearForm()" style="flex:1;">清空</button>
            </div>
            <div id="formStatus" class="status" style="margin-top:0.6rem;">填写信息后保存</div>
        </div>

        <div class="card" style="grid-column:1/span 2;">
            <h2>设备日志</h2>
            <div class="row" style="gap:0.5rem; align-items:flex-end;">
                <div style="flex:1 1 260px;">
                    <label>选择设备</label>
                    <select id="log_device" style="width:100%; padding:0.6rem 0.75rem; border:1px solid var(--border); border-radius:8px;"></select>
                </div>
                <div style="flex:0 0 auto; display:flex; gap:0.4rem;">
                    <button class="ghost" onclick="loadLogs()">刷新日志</button>
                </div>
            </div>
            <div class="logs" id="logList">选择设备后查看日志</div>
        </div>
      </main>
    </div>
  </div>

    <script>

        const token = localStorage.getItem('token');
        const username = localStorage.getItem('username');
        if (!token) { window.location.href = '/web/auth'; }
        else { document.getElementById('welcome').textContent = username ? `你好，${username}` : '已登录'; }
        
        async function parseJsonSafe(res) {
            const text = await res.text().catch(() => '');
            try { return { data: JSON.parse(text || '{}'), raw: text }; }
            catch (e) { return { data: { detail: '响应解析失败', error: e?.message }, raw: text }; }
        }
        async function fetchJsonOk(url, options = {}, context = '请求') {
            const res = await fetch(url, options);
            const { data, raw } = await parseJsonSafe(res);
            if (!res.ok) {
                const detail = data?.detail || data?.message || raw || `${context}失败`;
                throw new Error(`${context}失败: ${detail} (HTTP ${res.status})`);
            }
            return data;
        }
        function setStatus(msg, good=false, bad=false) {
            const box = document.getElementById('status');
            box.textContent = msg;
            box.className = 'status ' + (good ? 'good' : bad ? 'bad' : '');
        }
        function setFormStatus(msg, good=false, bad=false) {
            const box = document.getElementById('formStatus');
            box.textContent = msg;
            box.className = 'status ' + (good ? 'good' : bad ? 'bad' : '');
        }
        function parseUtcPlus8(dateStr) {
            if (!dateStr) return null;
            const utc = new Date(dateStr.endsWith('Z') ? dateStr : `${dateStr}Z`);
            if (isNaN(utc.getTime())) return null;
            const display = new Date(utc.getTime() + 8 * 3600 * 1000);
            return { utc, display };
        }
        function renderStats(devices) {
            const now = Date.now();
            let online = 0, offline = 0, recent = '-';
            let latest = 0;
            devices.forEach(d => {
                const parsed = parseUtcPlus8(d.last_heartbeat);
                const age = parsed ? (now - parsed.utc.getTime()) / 1000 : null;
                const isOnline = d.connection_status === 'online' && age !== null && age < 90;
                if (isOnline) online++; else offline++;
                if (parsed && parsed.utc.getTime() > latest) {
                    latest = parsed.utc.getTime();
                    recent = `${parsed.display.toLocaleString('zh-CN')} (${Math.floor(age)}s前)`;
                }
            });
            document.getElementById('stat_online').textContent = online;
            document.getElementById('stat_offline').textContent = offline;
            document.getElementById('stat_recent').textContent = recent;
        }
        function renderDevices(devices) {
            const body = document.getElementById('deviceBody');
            body.innerHTML = '';
            if (!devices.length) {
                body.innerHTML = '<tr><td colspan="7" style="text-align:center;color:#718096;">暂无设备</td></tr>';
                return;
            }
            devices.forEach(d => {
                const parsed = parseUtcPlus8(d.last_heartbeat);
                const heartbeatAgeSec = parsed ? Math.floor((Date.now() - parsed.utc.getTime()) / 1000) : null;
                const online = d.connection_status === 'online' && heartbeatAgeSec !== null && heartbeatAgeSec < 90;
                const heartbeatText = parsed ? `${parsed.display.toLocaleString('zh-CN')} (${heartbeatAgeSec}s前)` : '-';
                const statusPill = `<span class="pill ${online ? 'online' : 'offline'}">${online ? '在线' : '离线'}</span>`;
                const activeText = d.is_active ? '启用' : '禁用';
                const locIp = `${d.location || '-'}${d.ip_address ? ' / ' + d.ip_address : ''}`;
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${d.device_id}</td>
                    <td>${d.device_name || '-'}</td>
                    <td>${d.device_type}</td>
                    <td>${locIp}</td>
                    <td>${statusPill} <span class="muted">${activeText}${d.connection_status ? ' / ' + d.connection_status : ''}</span></td>
                    <td>${heartbeatText}</td>
                    <td class="actions">
                        <button class="ghost" onclick="toggleDevice('${d.device_id}', ${!d.is_active})">${d.is_active ? '禁用' : '启用'}</button>
                        <button class="ghost" onclick="deleteDevice('${d.device_id}')">删除</button>
                        <button class="ghost" onclick="selectLogDevice('${d.device_id}')">日志</button>
                    </td>
                `;
                body.appendChild(tr);
            });
        }
        async function loadDevices() {
            try {
                const data = await fetchJsonOk('/api/hardware/devices', { headers: authHeaders() }, '加载设备');
                renderDevices(data);
                renderStats(data);
                populateLogSelect(data);
                setStatus('设备加载完成', true);
            } catch (e) {
                console.error('加载设备失败', e);
                setStatus(e.message, false, true);
            }
        }
        function populateLogSelect(devices) {
            const sel = document.getElementById('log_device');
            const current = sel.value;
            sel.innerHTML = '';
            devices.forEach(d => {
                const opt = document.createElement('option');
                opt.value = d.device_id;
                opt.textContent = `${d.device_name || d.device_id} (${d.device_id})`;
                sel.appendChild(opt);
            });
            if (current && devices.some(d => d.device_id === current)) sel.value = current;
        }
        async function saveDevice() {
            const payload = {
                device_id: document.getElementById('d_id').value.trim(),
                device_name: document.getElementById('d_name').value.trim(),
                device_type: document.getElementById('d_type').value,
                location: document.getElementById('d_loc').value.trim(),
                ip_address: document.getElementById('d_ip').value.trim() || null,
                port: document.getElementById('d_port').value ? Number(document.getElementById('d_port').value) : null,
            };
            if (!payload.device_id || !payload.device_name) return setFormStatus('设备ID和名称必填', false, true);
            try {
                await fetchJsonOk('/api/hardware/devices', {
                    method:'POST', headers:{ 'Content-Type':'application/json', ...authHeaders() }, body: JSON.stringify(payload)
                }, '创建设备');
                setFormStatus('创建成功', true); 
                loadDevices();
                // 通知其他页面设备列表已更新
                localStorage.setItem('deviceListUpdate', Date.now().toString());
            } catch (e) { console.error('创建设备失败', e); setFormStatus(e.message, false, true); }
        }
        async function toggleDevice(device_id, enable) {
            try {
                await fetchJsonOk(`/api/hardware/devices/${device_id}`, {
                    method:'PUT', headers:{ 'Content-Type':'application/json', ...authHeaders() }, body: JSON.stringify({ is_active: enable })
                }, '更新设备');
                setStatus('更新成功', true); 
                loadDevices();
                // 通知其他页面设备列表已更新
                localStorage.setItem('deviceListUpdate', Date.now().toString());
            } catch (e) { console.error('更新设备失败', e); setStatus(e.message, false, true); }
        }
        async function deleteDevice(device_id) {
            if (!confirm('确定删除此设备？')) return;
            try {
                await fetchJsonOk(`/api/hardware/devices/${device_id}`, { method:'DELETE', headers: authHeaders() }, '删除设备');
                setStatus('删除成功', true); 
                loadDevices();
                // 通知其他页面设备列表已更新
                localStorage.setItem('deviceListUpdate', Date.now().toString());
            } catch (e) { console.error('删除设备失败', e); setStatus(e.message, false, true); }
        }
        function clearForm() {
            document.getElementById('d_id').value = '';
            document.getElementById('d_name').value = '';
            document.getElementById('d_type').value = 'door_controller';
            document.getElementById('d_loc').value = '';
            document.getElementById('d_ip').value = '';
            document.getElementById('d_port').value = '';
            setFormStatus('已清空', false, false);
        }
        function selectLogDevice(deviceId) {
            const sel = document.getElementById('log_device');
            sel.value = deviceId;
            loadLogs();
        }
        async function loadLogs() {
            const deviceId = document.getElementById('log_device').value;
            const box = document.getElementById('logList');
            if (!deviceId) { box.textContent = '请选择设备'; return; }
            try {
                const data = await fetchJsonOk(`/api/hardware/logs/device/${encodeURIComponent(deviceId)}?limit=50&days=30`, { headers: authHeaders() }, '加载日志');
                box.innerHTML = '';
                if (!data.length) { box.textContent = '暂无日志'; return; }
                data.forEach(log => {
                    const parsed = parseUtcPlus8(log.timestamp);
                    const timeText = parsed ? parsed.display.toLocaleString('zh-CN') : '-';
                    const item = document.createElement('div');
                    item.className = 'log-item';
                    item.innerHTML = `
                        <div><strong>${log.access_type || 'unknown'}</strong> · <span class="${log.status === 'success' ? 'pill online' : 'pill offline'}">${log.status}</span></div>
                        <div class="muted">时间: ${timeText} | 用户: ${log.user_id ?? '-'} | 设备: ${log.device_id}</div>
                        <div class="muted">详情: ${log.details || '-'}</div>
                    `;
                    box.appendChild(item);
                });
            } catch (e) {
                console.error('加载日志失败', e);
                box.textContent = e.message;
                setStatus('日志加载失败：' + e.message, false, true);
            }
        }
        loadDevices();
        setInterval(loadDevices, 30000);
      </script>
  </body>
</html>
