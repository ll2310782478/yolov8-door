<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>访客管理 - SmartAccess</title>
        <style>

        /* 左侧导航栏 */
        .sidebar-header .icon { font-size: 1.8rem; }
        .sidebar-header .title {
            font-size: 1.1rem;
            font-weight: 700;
            white-space: nowrap;
            opacity: 1;
            transition: opacity 0.3s;
        }
        .sidebar.collapsed .sidebar-header .title { opacity: 0; width: 0; overflow: hidden; }
        .sidebar-toggle:hover { background: rgba(255,255,255,0.25); }
        .nav-link:hover, .nav-link.active {
            background: rgba(255,255,255,0.15);
            color: #fff;
        }
        .nav-link .icon { font-size: 1.3rem; min-width: 1.3rem; }
        .nav-link .label {
            white-space: nowrap;
            opacity: 1;
            transition: opacity 0.3s;
        }
        .sidebar.collapsed .nav-link .label { opacity: 0; width: 0; overflow: hidden; }
        /* 主内容区 */
        .topbar {
            background: #fff;
            border-bottom: 1px solid var(--border);
            padding: 0.75rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .user-actions { display: flex; gap: 0.75rem; align-items: center; }
        .user-actions span { color: var(--text-muted); }
        /* 访客管理特定样式 */
        .controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }
        input, button {
            padding: 0.75rem 1rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1rem;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
        }
        .row { display:flex; gap:0.5rem; flex-wrap:wrap; }
        .row input, .row select { flex:1 1 48%; min-width:220px; }
        .visitor-card {
            background: #f9f9f9;
            border-left: 4px solid #667eea;
            padding: 1.5rem;
            margin-bottom: 1rem;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .visitor-info h3 {
            color: #333;
            margin-bottom: 0.5rem;
        }
        .visitor-info p {
            color: #666;
            font-size: 0.9rem;
            margin: 0.25rem 0;
        }
        .visitor-actions {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .btn-edit {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        .valid-time {
            margin-top: 0.5rem;
            padding: 0.4rem 0.6rem;
            background: #e8f5e9;
            border-radius: 4px;
            font-size: 0.85rem;
            color: #2e7d32;
        }
        .valid-time.expired {
            background: #fbe9e7;
            color: #c62828;
        }
        .close {
            color: #aaa;
            float: right;
            font-size: 2rem;
            font-weight: bold;
            cursor: pointer;
        }
        .close:hover {
            color: black;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
            color: #333;
        }
        input[type="text"],
        input[type="email"],
        textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1rem;
        }
        .qrcode-display {
            text-align: center;
            padding: 2rem;
        }
        .qrcode-display img {
            max-width: 300px;
            border: 2px solid #667eea;
            padding: 1rem;
        }
        </style>
  <link rel="stylesheet" href="/static/css/common.css">
  </head>
<body>
  <script src="/static/js/common.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', async () => {
      const token = localStorage.getItem('token');
      if (!token) {
        window.location.href = '/web/auth';
        return;
      }
      
      try {
        const res = await fetch('/api/auth/me', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!res.ok) throw new Error('未授权');
      } catch (err) {
        localStorage.removeItem('token');
        window.location.href = '/web/auth';
      }
    });
  </script>
  <!-- 左侧导航栏 -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="icon">🔐</span>
      <span class="title">SmartAccess</span>
      <button class="sidebar-toggle" onclick="toggleSidebar()">☰</button>
    </div>
    <nav>
      <ul class="nav-menu">
        <li class="nav-item">
          <a href="/web/dashboard" class="nav-link" data-tooltip="仪表盘">
            <span class="icon">📊</span>
            <span class="label">仪表盘</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="/web/users" class="nav-link" data-tooltip="用户管理">
            <span class="icon">👥</span>
            <span class="label">用户管理</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="/web/visitors" class="nav-link active" data-tooltip="访客管理">
            <span class="icon">👤</span>
            <span class="label">访客管理</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="/web/face" class="nav-link" data-tooltip="人脸识别">
            <span class="icon">😀</span>
            <span class="label">人脸识别</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="/web/hardware" class="nav-link" data-tooltip="硬件设备">
            <span class="icon">🛠️</span>
            <span class="label">硬件设备</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="/web/nfc" class="nav-link" data-tooltip="NFC管理">
            <span class="icon">📶</span>
            <span class="label">NFC管理</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="/web/bluetooth" class="nav-link" data-tooltip="蓝牙设备">
            <span class="icon">🔵</span>
            <span class="label">蓝牙设备</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="/web/remote-door" class="nav-link" data-tooltip="远程开门">
            <span class="icon">🚪</span>
            <span class="label">远程开门</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="/web/logs" class="nav-link" data-tooltip="访问日志">
            <span class="icon">📜</span>
            <span class="label">访问日志</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="/web/settings" class="nav-link" data-tooltip="系统设置">
            <span class="icon">⚙️</span>
            <span class="label">系统设置</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="/docs" class="nav-link" data-tooltip="API文档" target="_blank">
            <span class="icon">📖</span>
            <span class="label">API文档</span>
          </a>
        </li>
      </ul>
    </nav>
  </aside>

  <!-- 主内容区 -->
  <div class="main-content">
    <div class="topbar">
      <h1>访客管理</h1>
      <div class="user-actions">
        <span id="welcome"></span>
        <button class="btn btn-ghost" onclick="loadVisitors()">🔄 刷新</button>
        <button class="btn btn-primary" onclick="logout()">退出登录</button>
      </div>
    </div>

    <div class="content">
        <div class="controls">
            <input type="text" id="searchInput" placeholder="搜索访客名称或公司...">
            <button onclick="openAddVisitorModal()">➕ 添加新访客</button>
            <button onclick="loadVisitors()">刷新</button>
        </div>
        
        <div id="visitorsList">
            <!-- 动态生成的访客卡片 -->
        </div>
    
    <!-- 添加访客模态框 -->
    <div id="visitorModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeVisitorModal()">&times;</span>
            <h2>添加新访客</h2>
            
            <form id="visitorForm">
                <div class="row">
                    <div class="form-group" style="flex:1 1 48%;">
                        <label for="visitorName">访客名称</label>
                        <input type="text" id="visitorName" required>
                    </div>
                    <div class="form-group" style="flex:1 1 48%;">
                        <label for="visitorCompany">公司</label>
                        <input type="text" id="visitorCompany">
                    </div>
                </div>
                
                <div class="row">
                    <div class="form-group" style="flex:1 1 48%;">
                        <label for="visitorPhone">电话</label>
                        <input type="text" id="visitorPhone">
                    </div>
                    <div class="form-group" style="flex:1 1 48%;">
                        <label for="visitorEmail">邮箱</label>
                        <input type="email" id="visitorEmail">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="visitorPurpose">访问目的</label>
                    <textarea id="visitorPurpose" rows="2"></textarea>
                </div>

                <div style="margin-top: 1rem; padding-top: 1rem; border-top: 1px solid #eee;">
                    <h3>权限设置</h3>
                    <div class="row">
                        <div class="form-group" style="flex:1 1 48%;">
                            <label for="startTime">生效时间</label>
                            <input type="datetime-local" id="startTime">
                        </div>
                        <div class="form-group" style="flex:1 1 48%;">
                            <label for="endTime">失效时间</label>
                            <input type="datetime-local" id="endTime">
                        </div>
                    </div>
                    <div class="row">
                        <div class="form-group" style="flex:1 1 48%;">
                            <label for="maxUses">最大使用次数 (0为不限)</label>
                            <input type="number" id="maxUses" value="1" min="0">
                        </div>
                        <div class="form-group" style="flex:1 1 48%;">
                            <label for="accessLevel">门禁权限</label>
                            <select id="accessLevel" style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px; font-size: 1rem;">
                                <option value="door1">门 1 (Door 1)</option>
                                <option value="door2">门 2 (Door 2)</option>
                                <option value="all">所有门 (All Doors)</option>
                            </select>
                        </div>
                    </div>
                </div>
                
                <button type="submit" style="margin-top: 1rem;">创建访客</button>
            </form>
        </div>
    </div>

    <!-- 二维码显示模态框 -->
    <div id="qrcodeModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeQrcodeModal()">&times;</span>
            <h2>访客二维码</h2>
            <div class="qrcode-display" id="qrcodeDisplay">
                <!-- 动态生成二维码 -->
            </div>
        </div>
    </div>

    <!-- 编辑访客模态框 -->
    <div id="editVisitorModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeEditVisitorModal()">&times;</span>
            <h2>编辑访客信息</h2>
            <form id="editVisitorForm">
                <input type="hidden" id="editVisitorId">
                <div class="row">
                    <div><label>姓名</label><input type="text" id="editName" required></div>
                    <div><label>公司</label><input type="text" id="editCompany"></div>
                </div>
                <div class="row">
                    <div><label>电话</label><input type="text" id="editPhone"></div>
                    <div><label>邮箱</label><input type="email" id="editEmail"></div>
                </div>
                <label>来访目的</label>
                <input type="text" id="editPurpose">
                <br><br>
                <button type="submit">保存修改</button>
            </form>
        </div>
    </div>
    </div>
  </div>

    <script>

        const token = localStorage.getItem('token');
        const username = localStorage.getItem('username');
        if (!token) {
            window.location.href = '/web/auth';
        } else {
            document.getElementById('welcome').textContent = username ? `你好，${username}` : '已登录';
        }
        
        // 加载访客列表
        function loadVisitors() {
            fetch('/api/visitors/?is_checked_out=false', { headers: authHeaders() })
                .then(async response => {
                    const data = await response.json();
                    if (!response.ok) throw new Error(data.detail || '加载访客失败');
                    return data;
                })
                .then(data => {
                    const list = document.getElementById('visitorsList');
                    list.innerHTML = '';
                    if (data.length === 0) {
                        list.innerHTML = '<p style="text-align: center; color: #999;">暂无访客记录</p>';
                        return;
                    }
                    data.forEach(visitor => {
                        const card = document.createElement('div');
                        card.className = 'visitor-card';
                        
                        let accessText = '门 1';
                        if (visitor.access_level === 'door2') accessText = '门 2';
                        if (visitor.access_level === 'all') accessText = '所有门';
                        
                        const usesText = visitor.max_uses > 0 ? `${visitor.accessed_count} / ${visitor.max_uses}` : `${visitor.accessed_count} / 不限`;

                        // 有效时间
                        let validTimeHtml = '';
                        if (visitor.permission_start_time && visitor.permission_expires_at) {
                            const start = new Date(visitor.permission_start_time);
                            const end = new Date(visitor.permission_expires_at);
                            const now = new Date();
                            const isExpired = now > end;
                            const notStarted = now < start;
                            let statusLabel = '有效';
                            let cssClass = 'valid-time';
                            if (isExpired) { statusLabel = '已过期'; cssClass = 'valid-time expired'; }
                            else if (notStarted) { statusLabel = '未生效'; cssClass = 'valid-time expired'; }
                            validTimeHtml = `<div class="${cssClass}">⏰ 有效时间: ${start.toLocaleString('zh-CN')} ~ ${end.toLocaleString('zh-CN')}（${statusLabel}）</div>`;
                        }

                        card.innerHTML = `
                            <div class="visitor-info">
                                <h3>${visitor.name}</h3>
                                <p>公司: ${visitor.company || '-'}</p>
                                <p>电话: ${visitor.phone || '-'}</p>
                                <p>目的: ${visitor.purpose || '-'}</p>
                                <p>权限: <strong>${accessText}</strong></p>
                                <p>使用次数: ${usesText}</p>
                                <p>入场时间: ${new Date(visitor.check_in_time).toLocaleString('zh-CN')}</p>
                                ${validTimeHtml}
                            </div>
                            <div class="visitor-actions">
                                <button class="btn-small btn-edit" onclick='openEditVisitorModal(${JSON.stringify(visitor).replace(/'/g, "&#39;")})'>编辑</button>
                                <button class="btn-small btn-qrcode" onclick="showQrcode(${visitor.id})">二维码</button>
                                <button class="btn-small btn-qrcode" onclick="sendQrcode(${visitor.id}, 'email')">发邮箱</button>
                                <button class="btn-small btn-qrcode" onclick="sendQrcode(${visitor.id}, 'sms')">发短信</button>
                                <button class="btn-small btn-checkout" onclick="checkoutVisitor(${visitor.id})">离场</button>
                            </div>
                        `;
                        list.appendChild(card);
                    });
                })
                .catch(error => console.error('Error:', error));
        }
        function openAddVisitorModal() {
            document.getElementById('visitorForm').reset();
            // 设置默认时间
            const now = new Date();
            const tomorrow = new Date(now);
            tomorrow.setDate(tomorrow.getDate() + 1);
            
            // 格式化为 datetime-local 需要的格式 (YYYY-MM-DDTHH:mm)
            const formatDateTime = (date) => {
                const pad = (n) => n < 10 ? '0' + n : n;
                return `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
            };
            
            document.getElementById('startTime').value = formatDateTime(now);
            document.getElementById('endTime').value = formatDateTime(tomorrow);
            
            document.getElementById('visitorModal').style.display = 'block';
        }
        function closeVisitorModal() {
            document.getElementById('visitorModal').style.display = 'none';
        }
        function closeQrcodeModal() {
            document.getElementById('qrcodeModal').style.display = 'none';
        }

        // 编辑访客
        function openEditVisitorModal(visitor) {
            document.getElementById('editVisitorId').value = visitor.id;
            document.getElementById('editName').value = visitor.name || '';
            document.getElementById('editCompany').value = visitor.company || '';
            document.getElementById('editPhone').value = visitor.phone || '';
            document.getElementById('editEmail').value = visitor.email || '';
            document.getElementById('editPurpose').value = visitor.purpose || '';
            document.getElementById('editVisitorModal').style.display = 'block';
        }
        function closeEditVisitorModal() {
            document.getElementById('editVisitorModal').style.display = 'none';
        }
        document.getElementById('editVisitorForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const visitorId = document.getElementById('editVisitorId').value;
            const updateData = {
                name: document.getElementById('editName').value,
                phone: document.getElementById('editPhone').value,
                email: document.getElementById('editEmail').value,
                company: document.getElementById('editCompany').value,
                purpose: document.getElementById('editPurpose').value
            };
            fetch(`/api/visitors/${visitorId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', ...authHeaders() },
                body: JSON.stringify(updateData)
            })
            .then(async response => {
                const data = await response.json();
                if (!response.ok) throw new Error(data.detail || '更新失败');
                return data;
            })
            .then(() => {
                alert('访客信息已更新');
                closeEditVisitorModal();
                loadVisitors();
            })
            .catch(error => alert(error.message));
        });
        function showQrcode(visitorId) {
            // 直接使用新的图片端点
            const imgUrl = `/api/visitors/${visitorId}/qrcode/image?token=${token}`;
            const qrcodeDisplay = document.getElementById('qrcodeDisplay');
            qrcodeDisplay.innerHTML = `
                <img src="${imgUrl}" alt="访客二维码" onerror="this.src=''; this.alt='二维码加载失败'">
                <p>请使用手机拍照或截图保存</p>
            `;
            document.getElementById('qrcodeModal').style.display = 'block';
        }
        function sendQrcode(visitorId, via) {
            fetch(`/api/visitors/${visitorId}/send-qrcode?send_via=${via}`, {
                method: 'POST',
                headers: authHeaders()
            })
            .then(async response => {
                const data = await response.json();
                if (!response.ok) throw new Error(data.detail || data.message || '发送失败');
                return data;
            })
            .then(data => {
                alert(data.message || '已发送');
            })
            .catch(error => alert(error.message));
        }
        function checkoutVisitor(visitorId) {
            if (confirm('确定访客已离场？')) {
                fetch(`/api/visitors/${visitorId}/checkout`, {
                    method: 'POST',
                    headers: authHeaders()
                })
                .then(async response => {
                    const data = await response.json();
                    if (!response.ok) throw new Error(data.detail || '操作失败');
                    return data;
                })
                .then(data => {
                    alert(data.message);
                    loadVisitors();
                })
                .catch(error => alert(error.message));
            }
        }
        // 访客表单提交
        document.getElementById('visitorForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // 构建请求数据
            const visitorData = {
                name: document.getElementById('visitorName').value,
                phone: document.getElementById('visitorPhone').value,
                email: document.getElementById('visitorEmail').value,
                company: document.getElementById('visitorCompany').value,
                purpose: document.getElementById('visitorPurpose').value,
                // 权限数据
                start_time: document.getElementById('startTime').value,
                end_time: document.getElementById('endTime').value,
                max_uses: parseInt(document.getElementById('maxUses').value) || 0,
                access_level: document.getElementById('accessLevel').value
            };
            
            // 确保时间格式包含秒，如果后端需要 ISO 格式
            if (visitorData.start_time) visitorData.start_time = new Date(visitorData.start_time).toISOString();
            if (visitorData.end_time) visitorData.end_time = new Date(visitorData.end_time).toISOString();

            fetch('/api/visitors/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    ...authHeaders()
                },
                body: JSON.stringify(visitorData)
            })
            .then(async response => {
                const data = await response.json();
                if (!response.ok) throw new Error(data.detail || '创建访客失败');
                return data;
            })
            .then(data => {
                const hasEmail = !!visitorData.email;
                alert(hasEmail ? '访客创建成功，系统已自动发送二维码邮件（如邮件配置有效）！' : '访客创建成功！');
                closeVisitorModal();
                loadVisitors();
            })
            .catch(error => alert(error.message));
        });

        // 页面加载时获取访客列表
        loadVisitors();
      </script>
  </body>
</html>
