<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartAccess 控制台</title>
    <style>
        :root {
            --primary: #667eea;
            --bg: #f7fafc;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--bg);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #1a202c;
        }
        header {
            background: #fff;
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .logo { font-weight: 700; font-size: 1.2rem; color: var(--primary); }
        .actions { display: flex; gap: 0.75rem; align-items: center; }
        .btn {
            padding: 0.65rem 1rem;
            border-radius: 10px;
            border: none;
            background: var(--primary);
            color: #fff;
            cursor: pointer;
        }
        .ghost-btn {
            background: #edf2f7;
            color: #1a202c;
            border: none;
            padding: 0.65rem 1rem;
            border-radius: 10px;
            cursor: pointer;
        }
        main { max-width: 1100px; margin: 2rem auto; padding: 0 1.5rem; }
        .card {
            background: #fff;
            border-radius: 14px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
        }
        h1 { margin-top: 0; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1rem;
            margin-top: 1.5rem;
        }
        .tile {
            padding: 1.25rem;
            border-radius: 12px;
            background: linear-gradient(135deg, #667eea0f 0%, #764ba20f 100%);
            border: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .tile h3 { margin: 0; }
        .tile p { margin: 0; color: #4a5568; }
        .tile a {
            margin-top: auto;
            text-decoration: none;
            background: var(--primary);
            color: #fff;
            padding: 0.65rem 0.9rem;
            border-radius: 10px;
            text-align: center;
        }
        .muted { color: #4a5568; }
    </style>
</head>
<body>
    <header>
        <div class="logo">🔐 SmartAccess 控制台</div>
        <div class="actions">
            <span id="welcome" class="muted"></span>
            <button class="ghost-btn" onclick="goHome()">首页</button>
            <button class="btn" onclick="logout()">退出登录</button>
        </div>
    </header>

    <main>
        <div class="card">
            <h1>选择要管理的功能</h1>
            <p class="muted">通过按钮进入对应的管理界面，所有界面均基于现有 API 构建。</p>
            <div class="grid">
                <div class="tile">
                    <h3>👥 用户管理</h3>
                    <p>添加/删除用户，更新基本信息。</p>
                    <a href="/web/users">进入用户管理</a>
                </div>
                <div class="tile">
                    <h3>👤 访客管理</h3>
                    <p>登记访客、生成二维码、办理离场。</p>
                    <a href="/web/visitors">进入访客管理</a>
                </div>
                <div class="tile">
                    <h3>😀 人脸识别管理</h3>
                    <p>摄像头取流、录入人脸、识别并联动开门。</p>
                    <a href="/web/face">进入人脸管理</a>
                </div>
                <div class="tile">
                    <h3>🛠️ 硬件设备</h3>
                    <p>注册门锁/读头设备，查看状态。</p>
                    <a href="/web/hardware">设备管理</a>
                </div>
                <div class="tile">
                    <h3>📜 访问日志</h3>
                    <p>查看近日志，支持类型/状态筛选。</p>
                    <a href="/web/logs">查看日志</a>
                </div>
                <div class="tile">
                    <h3>📖 API 文档</h3>
                    <p>需要自动化或二开时查看。</p>
                    <a href="/docs">打开 Swagger</a>
                </div>
            </div>
        </div>
    </main>

    <script>
        const token = localStorage.getItem('smartaccess_token');
        const username = localStorage.getItem('smartaccess_username');
        if (!token) {
            window.location.href = '/web/auth';
        } else {
            document.getElementById('welcome').textContent = username ? `你好，${username}` : '已登录';
        }
        function logout() {
            localStorage.removeItem('smartaccess_token');
            localStorage.removeItem('smartaccess_username');
            window.location.href = '/web/auth';
        }
        function goHome() {
            window.location.href = '/';
        }
    </script>
</body>
</html>
