<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>硬件测试页面</title>
  <style>
    body { font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; margin:0; background:#f7fafc; color:#1a202c; }
    header { background:#fff; border-bottom:1px solid #e2e8f0; padding:1rem 1.25rem; position:sticky; top:0; }
    main { max-width:1100px; margin:1.5rem auto; background:#fff; border-radius:14px; box-shadow:0 10px 30px rgba(0,0,0,.06); padding:1.25rem 1.5rem; }
    h1 { margin:0; font-size:1.25rem; }
    table { width:100%; border-collapse:collapse; margin-top:0.75rem; }
    th, td { padding:0.6rem; border-bottom:1px solid #e2e8f0; text-align:left; }
    th { background:#f8fafc; }
    .status { margin-top:0.75rem; padding:0.6rem; border-radius:10px; background:#edf2f7; }
    .good { background:#e6fffa; color:#047857; }
    .bad { background:#fef2f2; color:#b91c1c; }
    button { background:#667eea; color:#fff; border:none; padding:0.5rem 0.8rem; border-radius:8px; cursor:pointer; }
    button.ghost { background:#edf2f7; color:#1a202c; }
    .actions { display:flex; gap:0.4rem; flex-wrap:wrap; }
  </style>
</head>
<body>
  <header>
    <h1>🔧 硬件测试页面（查看设备注册信息并发送指令）</h1>
  </header>
  <main>
    <div class="status" id="status">加载中...</div>
    <table>
      <thead>
        <tr>
          <th>设备ID</th>
          <th>名称</th>
          <th>类型</th>
          <th>位置</th>
          <th>IP</th>
          <th>端口</th>
          <th>状态</th>
          <th>最后心跳</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>

    <h2 style="margin-top:1.5rem;">卡片管理（录入/删除）</h2>
    <div class="status" id="cardStatus">选择用户后点击“开始录入”</div>
    <div style="display:flex; flex-wrap:wrap; gap:0.6rem; margin-top:0.6rem; align-items:center;">
      <select id="cardUser" style="flex:1 1 220px; padding:0.5rem;"></select>
      <select id="deviceSelect" style="flex:0 0 150px; padding:0.5rem;">
        <option value="">选择设备</option>
      </select>
      <select id="doorSelect" style="flex:0 0 120px; padding:0.5rem;">
        <option value="door1">门1</option>
        <option value="door2">门2</option>
      </select>
      <input id="cardName" placeholder="卡片名称(可选)" style="flex:1 1 200px; padding:0.5rem;">
      <button id="btnEnroll" onclick="startEnroll()">开始录入</button>
      <button class="ghost" onclick="loadUsers(); loadCards();">刷新用户/卡片</button>
    </div>

    <table style="margin-top:0.8rem;">
      <thead>
        <tr>
          <th>ID</th>
          <th>卡号</th>
          <th>用户</th>
          <th>名称</th>
          <th>门</th>
          <th>状态</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="cardBody"></tbody>
    </table>
  </main>

  <script>
    const token = localStorage.getItem('smartaccess_token');
    if (!token) { window.location.href = '/web/auth'; }

    function authHeaders(extra = {}) { return { 'Authorization': `Bearer ${token}`, ...extra }; }
    async function parseJsonSafe(res) {
      try {
        const text = await res.text();
        return JSON.parse(text);
      } catch (e) {
        return { detail: '响应解析失败：' + (e.message || '未知错误') };
      }
    }

    async function loadDevices() {
      try {
        const res = await fetch('/api/hardware/devices', { headers: authHeaders() });
        const data = await parseJsonSafe(res);
        if (!res.ok) throw new Error(data.detail || '加载设备失败');
        const deviceSel = document.getElementById('deviceSelect');
        deviceSel.innerHTML = '<option value="">选择设备</option>';
        const tbody = document.getElementById('tbody');
        tbody.innerHTML = '';
        if (!data.length) {
          tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;color:#718096;">暂无设备</td></tr>';
        }
        data.forEach(d => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${d.device_id}</td>
            <td>${d.device_name || '-'}</td>
            <td>${d.device_type}</td>
            <td>${d.location || '-'}</td>
            <td>${d.ip_address || '-'}</td>
            <td>${d.port != null ? d.port : '-'}</td>
            <td>${d.is_active ? '启用' : '禁用'} ${d.connection_status ? '('+d.connection_status+')' : ''}</td>
            <td>${d.last_heartbeat ? new Date(d.last_heartbeat).toLocaleString('zh-CN') : '-'}</td>
            <td class="actions">
              <button class="ghost" onclick="triggerScan('${d.device_id}')">触发扫描</button>
              <button onclick="openDoor('${d.device_id}')">远程开门</button>
            </td>
          `;
          tbody.appendChild(tr);

          // 只有支持 NFC 的设备才加入录入下拉
          if (d.device_type?.includes('nfc') || d.device_mode === 'remote_nfc') {
            const opt = document.createElement('option');
            opt.value = d.device_id;
            opt.textContent = d.device_name ? `${d.device_name} (${d.device_id})` : d.device_id;
            deviceSel.appendChild(opt);
          }
        });
        // 如果有设备，默认选第一个
        if (deviceSel.options.length > 1 && !deviceSel.value) {
          deviceSel.selectedIndex = 1;
        }
        setStatus('设备加载完成', true);
      } catch (e) {
        setStatus(e.message, false, true);
      }
    }

    async function loadUsers() {
      try {
        const res = await fetch('/api/users', { headers: authHeaders() });
        const data = await parseJsonSafe(res);
        if (!res.ok) throw new Error(data.detail || '加载用户失败');
        const sel = document.getElementById('cardUser');
        sel.innerHTML = '';
        data.forEach(u => {
          const opt = document.createElement('option');
          opt.value = u.id;
          opt.textContent = `${u.id} - ${u.full_name || u.username}`;
          sel.appendChild(opt);
        });
        setCardStatus('用户列表加载完成', true);
      } catch (e) {
        setCardStatus(e.message, false, true);
      }
    }

    async function loadCards() {
      try {
        const res = await fetch('/api/hardware/nfc/cards', { headers: authHeaders() });
        const data = await parseJsonSafe(res);
        if (!res.ok) throw new Error(data.detail || '加载卡片失败');
        const tbody = document.getElementById('cardBody');
        tbody.innerHTML = '';
        if (!data.length) {
          tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#718096;">暂无卡片</td></tr>';
        }
        data.forEach(c => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${c.id}</td>
            <td>${c.card_number}</td>
            <td>${c.user_id}</td>
            <td>${c.card_name || '-'}</td>
            <td>${c.door_id || 'door1'}</td>
            <td>${c.is_active ? '启用' : '禁用'}</td>
            <td><button class="ghost" onclick="deleteCard(${c.id})">删除</button></td>
          `;
          tbody.appendChild(tr);
        });
        setCardStatus('卡片加载完成', true);
      } catch (e) {
        setCardStatus(e.message, false, true);
      }
    }

    function setCardStatus(msg, good=false, bad=false) {
      const box = document.getElementById('cardStatus');
      box.textContent = msg;
      box.className = 'status ' + (good ? 'good' : bad ? 'bad' : '');
    }

    async function startEnroll() {
      const user_id = document.getElementById('cardUser').value;
      const card_name = document.getElementById('cardName').value.trim();
      const door_id = document.getElementById('doorSelect').value;
      const device_id = document.getElementById('deviceSelect').value;
      if (!user_id) return setCardStatus('请选择用户', false, true);
      if (!device_id) return setCardStatus('请选择支持NFC的设备', false, true);
      const btn = document.getElementById('btnEnroll');
      btn.disabled = true; setCardStatus('已下发 ENROLL，刷卡等待录入...', false, false);
      let taskId = null;
      try {
        // 下发 ENROLL 任务
        const res = await fetch('/api/hardware/nfc/command', {
          method:'POST', headers: authHeaders({ 'Content-Type':'application/json' }),
          body: JSON.stringify({ device_id, command:'ENROLL' })
        });
        const data = await parseJsonSafe(res);
        if (!res.ok) throw new Error(data.detail || '下发 ENROLL 失败');
        taskId = data.id;
        
        // 轮询任务结果（带超时机制）
        const TIMEOUT_MS = 10000; // 10秒超时
        const startTime = Date.now();
        let pollCount = 0;
        
        const pollStatus = async () => {
          pollCount++;
          const elapsed = Date.now() - startTime;
          
          // 检查超时
          if (elapsed > TIMEOUT_MS) {
            throw new Error(`读卡超时（${(TIMEOUT_MS/1000)}秒），请重试`);
          }
          
          // 更新状态提示
          const remaining = Math.ceil((TIMEOUT_MS - elapsed) / 1000);
          setCardStatus(`等待读卡... 剩余 ${remaining} 秒`, false, false);
          
          const r = await fetch(`/api/hardware/nfc/command/status/${taskId}`, { headers: authHeaders() });
          const d = await parseJsonSafe(r);
          if (!r.ok) throw new Error(d.detail || '查询任务失败');
          if (d.result) return d;
          
          await new Promise(res => setTimeout(res, 1000));
          return pollStatus();
        };
        
        const done = await pollStatus();
        // 解析 result 内容
        let card_uid = '';
        try { const parsed = JSON.parse(done.result); card_uid = parsed.card_uid || ''; } catch (e) { card_uid = ''; }
        if (!card_uid) throw new Error('任务完成但未获取卡号');
        // 写入卡片
        const payload = { user_id: Number(user_id), card_number: card_uid, card_name: card_name || null, door_id };
        const resAdd = await fetch('/api/hardware/nfc/cards', {
          method:'POST', headers: authHeaders({ 'Content-Type':'application/json' }),
          body: JSON.stringify(payload)
        });
        const dataAdd = await parseJsonSafe(resAdd);
        if (!resAdd.ok) throw new Error(dataAdd.detail || '录入失败');
        setCardStatus(`录入成功：${card_uid}`, true);
        loadCards();
      } catch (e) {
        setCardStatus(e.message, false, true);
      } finally {
        btn.disabled = false;
      }
    }

    async function deleteCard(id) {
      if (!confirm('确定删除此卡片？')) return;
      try {
        const res = await fetch(`/api/hardware/nfc/card/${id}`, { method:'DELETE', headers: authHeaders() });
        const data = await parseJsonSafe(res);
        if (!res.ok) throw new Error(data.detail || '删除失败');
        setCardStatus('删除成功', true);
        loadCards();
      } catch (e) {
        setCardStatus(e.message, false, true);
      }
    }

    function setStatus(msg, good=false, bad=false) {
      const box = document.getElementById('status');
      box.textContent = msg;
      box.className = 'status ' + (good ? 'good' : bad ? 'bad' : '');
    }

    async function triggerScan(device_id) {
      try {
        const res = await fetch('/api/hardware/nfc/command', {
          method:'POST', headers: authHeaders({ 'Content-Type':'application/json' }),
          body: JSON.stringify({ device_id, command:'SCAN' })
        });
        const data = await parseJsonSafe(res);
        if (!res.ok) throw new Error(data.detail || '创建任务失败');
        setStatus(`已触发扫描任务：#${data.id}`, true);
      } catch (e) {
        setStatus(e.message, false, true);
      }
    }

    async function openDoor(device_id) {
      const door_id = document.getElementById('doorSelect')?.value || 'door1';
      try {
        const res = await fetch('/api/hardware/nfc/command', {
          method:'POST', headers: authHeaders({ 'Content-Type':'application/json' }),
          body: JSON.stringify({ device_id, command:'OPEN', payload: JSON.stringify({ duration:1500, door_id }) })
        });
        const data = await parseJsonSafe(res);
        if (!res.ok) throw new Error(data.detail || '创建开门任务失败');
        setStatus(`已发送开门任务：#${data.id}`, true);
      } catch (e) {
        setStatus(e.message, false, true);
      }
    }

    loadDevices();
    loadCards();
    loadUsers();
  </script>
</body>
</html>
