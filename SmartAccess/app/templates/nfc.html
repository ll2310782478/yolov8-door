<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NFC管理 - SmartAccess</title>
        <style>

        /* 左侧导航栏 */
        .sidebar-header .icon { font-size: 1.8rem; }
        .sidebar-header .title {
            font-size: 1.1rem;
            font-weight: 700;
            white-space: nowrap;
            opacity: 1;
            transition: opacity 0.3s;
        }
        .sidebar.collapsed .sidebar-header .title { opacity: 0; width: 0; overflow: hidden; }
        .sidebar-toggle:hover { background: rgba(255,255,255,0.25); }
        .nav-link:hover, .nav-link.active {
            background: rgba(255,255,255,0.15);
            color: #fff;
        }
        .nav-link .icon { font-size: 1.3rem; min-width: 1.3rem; }
        .nav-link .label {
            white-space: nowrap;
            opacity: 1;
            transition: opacity 0.3s;
        }
        .sidebar.collapsed .nav-link .label { opacity: 0; width: 0; overflow: hidden; }
        /* 主内容区 */
        .topbar {
            background: #fff;
            border-bottom: 1px solid var(--border);
            padding: 0.75rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .user-actions { display: flex; gap: 0.75rem; align-items: center; }
        .user-actions span { color: var(--text-muted); }
        /* NFC页面特有样式 */
        .card-box {
          background: #fff;
          border-radius: 14px;
          padding: 2rem;
          box-shadow: 0 10px 30px rgba(0,0,0,0.06);
          margin-bottom: 2rem;
        }
        .section-title {
          font-size: 1.1rem;
          font-weight: 600;
          color: #1a202c;
          margin-bottom: 1rem;
          display: flex;
          align-items: center;
          gap: 0.5rem;
        }
        .section-title::before {
          content: '';
          width: 4px;
          height: 24px;
          background: var(--primary);
          border-radius: 2px;
        }
        .device-selector {
          display: flex;
          gap: 1rem;
          align-items: center;
          margin-bottom: 1.5rem;
          padding: 1rem;
          background: linear-gradient(135deg, #667eea0f 0%, #764ba20f 100%);
          border-radius: 12px;
          border: 1px solid var(--border);
        }
        .device-selector select {
          flex: 1;
          padding: 0.65rem 0.9rem;
          border: 1px solid var(--border);
          border-radius: 8px;
          background: #fff;
          color: #1a202c;
          font-size: 0.95rem;
        }
        .scan-box {
          padding: 1.5rem;
          background: linear-gradient(135deg, #667eea0f 0%, #764ba20f 100%);
          border: 1px solid var(--border);
          border-radius: 12px;
          display: flex;
          flex-direction: column;
          gap: 0.9rem;
          margin-bottom: 2rem;
        }
        .device-action-row {
          display: flex;
          align-items: center;
          gap: 0.7rem;
          width: 100%;
          flex-wrap: wrap;
        }
        .device-action-row label {
          min-width: 104px;
          font-size: 0.92rem;
          color: #4a5568;
          font-weight: 500;
        }
        .device-action-row select {
          flex: 1;
          min-width: 220px;
          padding: 0.6rem 0.8rem;
          border: 1px solid var(--border);
          border-radius: 8px;
          background: #fff;
        }
        #scanStatus {
          color: #4a5568;
          font-size: 0.95rem;
          display: block;
          width: 100%;
        }
        .table thead {
          background: #f7fafc;
          border-bottom: 2px solid var(--border);
        }
        .table th {
          padding: 1rem;
          text-align: left;
          font-weight: 600;
          color: #4a5568;
          font-size: 0.9rem;
        }
        .table td {
          padding: 0.9rem 1rem;
          border-bottom: 1px solid var(--border);
          font-size: 0.95rem;
        }
        .table tbody tr:hover {
          background: #f7fafc;
        }
        .status-badge {
          display: inline-block;
          padding: 0.25rem 0.65rem;
          border-radius: 6px;
          font-size: 0.85rem;
          font-weight: 500;
        }
        .status-active {
          background: #c6f6d5;
          color: #22543d;
        }
        .status-inactive {
          background: #fed7d7;
          color: #742a2a;
        }
        .form-group label {
          margin-bottom: 0.5rem;
          font-weight: 500;
          color: #2d3748;
          font-size: 0.95rem;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
          padding: 0.65rem 0.9rem;
          border: 1px solid var(--border);
          border-radius: 8px;
          font-size: 0.95rem;
          font-family: inherit;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
          outline: none;
          border-color: var(--primary);
          box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .form-checkbox input {
          width: auto;
          margin: 0;
        }
        .alert {
          padding: 1rem 1.25rem;
          border-radius: 10px;
          margin-bottom: 1rem;
          display: flex;
          justify-content: space-between;
          align-items: center;
          animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
          from {
            opacity: 0;
            transform: translateY(-10px);
          }
          to {
            opacity: 1;
            transform: translateY(0);
          }
        }
        .alert-success {
          background: #c6f6d5;
          color: #22543d;
          border: 1px solid #9ae6b4;
        }
        .alert-danger {
          background: #fed7d7;
          color: #742a2a;
          border: 1px solid #fc8181;
        }
        .alert-info {
          background: #bee3f8;
          color: #2c5aa0;
          border: 1px solid #90cdf4;
        }
        .alert-close {
          background: none;
          border: none;
          cursor: pointer;
          font-weight: 600;
          color: inherit;
        }
        .result-card {
          padding: 1.5rem;
          background: linear-gradient(135deg, #48bb780f 0%, #38a1690f 100%);
          border: 2px solid var(--success);
          border-radius: 12px;
          margin-top: 1rem;
          display: none;
        }
        .result-card.show {
          display: block;
          animation: slideIn 0.3s ease;
        }
        .result-title {
          font-weight: 600;
          color: #22543d;
          margin-bottom: 0.75rem;
        }
        .result-text {
          color: #2d3748;
          margin-bottom: 1rem;
        }
        .empty-state {
          text-align: center;
          padding: 2rem;
          color: #718096;
        }
        </style>
  <link rel="stylesheet" href="/static/css/common.css">
  </head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="icon">🔐</span>
      <span class="title">SmartAccess</span>
      <button class="sidebar-toggle" onclick="toggleSidebar()">☰</button>
    </div>
    <nav>
      <ul class="nav-menu">
        <li class="nav-item">
          <a href="/web/dashboard" class="nav-link" data-tooltip="仪表盘">
            <span class="icon">📊</span>
            <span class="label">仪表盘</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="/web/users" class="nav-link" data-tooltip="用户管理">
            <span class="icon">👥</span>
            <span class="label">用户管理</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="/web/visitors" class="nav-link" data-tooltip="访客管理">
            <span class="icon">👤</span>
            <span class="label">访客管理</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="/web/face" class="nav-link" data-tooltip="人脸识别">
            <span class="icon">😀</span>
            <span class="label">人脸识别</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="/web/hardware" class="nav-link" data-tooltip="硬件设备">
            <span class="icon">🛠️</span>
            <span class="label">硬件设备</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="/web/nfc" class="nav-link active" data-tooltip="NFC管理">
            <span class="icon">📶</span>
            <span class="label">NFC管理</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="/web/bluetooth" class="nav-link" data-tooltip="蓝牙设备">
            <span class="icon">🔵</span>
            <span class="label">蓝牙设备</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="/web/remote-door" class="nav-link" data-tooltip="远程开门">
            <span class="icon">🚪</span>
            <span class="label">远程开门</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="/web/logs" class="nav-link" data-tooltip="访问日志">
            <span class="icon">📜</span>
            <span class="label">访问日志</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="/web/settings" class="nav-link" data-tooltip="系统设置">
            <span class="icon">⚙️</span>
            <span class="label">系统设置</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="/docs" class="nav-link" data-tooltip="API文档" target="_blank">
            <span class="icon">📖</span>
            <span class="label">API文档</span>
          </a>
        </li>
      </ul>
    </nav>
  </aside>

  <div class="main-content">
    <div class="topbar">
      <h1>NFC管理</h1>
      <div class="user-actions">
        <span id="welcome"></span>
        <button class="btn btn-ghost" onclick="fetchCards()">🔄 刷新</button>
        <button class="btn btn-danger" onclick="logout()">🚪 退出登录</button>
      </div>
    </div>

    <div class="content">
      <div id="alertArea"></div>

      <!-- 设备选择和扫描区 -->
      <div class="card-box">
        <div class="section-title">设备选择与识别</div>
        <div class="device-selector">
          <label style="margin: 0; font-weight: 500;">设备列表：</label>
          <span style="color:#4a5568; font-size:0.92rem;">点击识别与录入卡片可分别选择不同设备</span>
          <button class="btn-outline" id="refreshDevices">🔄 刷新设备</button>
        </div>

        <div class="scan-box">
          <div class="device-action-row">
            <label for="scanDeviceSelect">点击识别设备</label>
            <select id="scanDeviceSelect"></select>
            <button id="btnScan" class="btn-primary">📱 点击识别</button>
          </div>
          <div class="device-action-row">
            <label for="enrollDeviceSelect">录入卡片设备</label>
            <select id="enrollDeviceSelect"></select>
            <button id="btnEnroll" class="btn-success">📝 录入卡片</button>
          </div>
          <span id="scanStatus"></span>
        </div>

        <div id="resultCard" class="result-card">
          <div class="result-title">✓ 执行结果</div>
          <div id="resultText" class="result-text"></div>
          <button id="closeResult" class="btn-outline" style="padding: 0.5rem 1rem;">关闭</button>
        </div>
      </div>

      <!-- 卡片列表 -->
      <div class="card-box">
        <div class="section-title">卡片列表</div>
        <table class="table">
          <thead>
            <tr>
              <th>ID</th>
              <th>用户</th>
              <th>卡号</th>
              <th>卡名</th>
              <th>状态</th>
              <th>权限（截止/每日限）</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="cardsTable"></tbody>
        </table>
      </div>

      <!-- 新增卡片 -->
      <div class="card-box">
        <div class="section-title">新增卡片</div>
        <form id="createForm">
          <div class="form-row">
            <div class="form-group">
              <label>选择用户 *</label>
              <select id="userSelect" required>
                <option value="">-- 选择用户 --</option>
              </select>
            </div>
            <div class="form-group">
              <label>卡号 *</label>
              <input id="cardNumber" type="text" placeholder="例：AA-BB-CC-DD" required>
            </div>
            <div class="form-group">
              <label>卡名</label>
              <input id="cardName" type="text" placeholder="例：我的卡">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>权限截止日期</label>
              <input id="permissionEnd" type="date">
            </div>
            <div class="form-group">
              <label>每日最大使用次数</label>
              <input id="maxDaily" type="number" placeholder="0 表示无限" min="0" value="0">
            </div>
            <div class="form-group" style="justify-content: flex-end; grid-column: auto;">
              <button type="submit" class="btn-success">➕ 添加卡片</button>
            </div>
          </div>
        </form>
      </div>

      <div id="message"></div>

      <!-- 编辑卡片 Modal -->
      <div id="editModal" class="modal">
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title">编辑卡片</h2>
            <button type="button" class="modal-close" onclick="document.getElementById('editModal').classList.remove('show')">×</button>
          </div>
          <div class="modal-body">
            <form id="editForm">
              <input type="hidden" id="editCardId">
              <div class="form-group">
                <label>卡名</label>
                <input id="editCardName" type="text">
              </div>
              <div class="form-group">
                <label>权限截止日期</label>
                <input id="editPermissionEnd" type="date">
              </div>
              <div class="form-group">
                <label>每日最大使用次数</label>
                <input id="editMaxDaily" type="number" min="0">
              </div>
              <div class="form-group">
                <label>时间段 (JSON)</label>
                <textarea id="editTimePeriods" rows="3" placeholder='{"monday":["09:00-17:00"]}'></textarea>
              </div>
              <div class="form-checkbox">
                <input id="editIsActive" type="checkbox">
                <label for="editIsActive" style="margin: 0;">启用此卡片</label>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn-outline" onclick="document.getElementById('editModal').classList.remove('show')">取消</button>
            <button type="button" id="saveEdit" class="btn-primary">保存修改</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/js/nfc.js"></script>

  
  <script src="/static/js/common.js"></script>
  <script>
    // 设置欢迎文本
    {
      const username = localStorage.getItem('username');
      const welcomeEl = document.getElementById('welcome');
      if (welcomeEl) welcomeEl.textContent = username ? `你好，${username}` : '已登录';
    }
    window.addEventListener('DOMContentLoaded', async () => {
      const token = localStorage.getItem('token');
      if (!token) {
        window.location.href = '/web/auth';
        return;
      }
      
      try {
        const res = await fetch('/api/auth/me', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!res.ok) throw new Error('未授权');
      } catch (err) {
        localStorage.removeItem('token');
        window.location.href = '/web/auth';
      }
    });
  </script>
  </body>
</html>
